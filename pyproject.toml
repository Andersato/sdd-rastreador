[project]
name = "precios-gasolineras"
version = "0.1.0"
description = "Recogida diaria de precios de gasolineras de España e histórico propio"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "docker: tests que construyen la imagen y lanzan contenedores (se saltan si Docker no está disponible)",
]
