# Ingesta de precios y API en contenedores. Uso (ver README):
#   docker compose build
#   docker compose up -d            # programador (captura cada 6 h y copia a las 04:43)
#                                   # y API en http://127.0.0.1:8000/api/docs
#   docker compose run --rm ingest  # una captura a mano
#   docker compose run --rm backup  # una copia de seguridad a mano

# Carpetas montadas con la sintaxis larga para que Docker no las cree si
# faltan (en Linux quedarían a nombre de root).
x-data: &data
  type: bind
  source: ./data
  target: /app/data
  bind:
    create_host_path: false

# Copias de seguridad: fuera de ./data, solo en el programador y en `backup`.
x-backups: &backups
  type: bind
  source: ./backups
  target: /app/backups
  bind:
    create_host_path: false

# Lo común a los servicios: misma imagen y mismo usuario.
x-app: &app
  build: .
  image: precios-gasolineras-ingest
  # UID/GID del usuario del host, desde .env: los archivos de ./data quedan
  # a su nombre también en Linux. Root (0) lo rechazan los programas de arranque.
  user: "${HOST_UID:?falta HOST_UID en .env (ver README)}:${HOST_GID:?falta HOST_GID en .env (ver README)}"
  # Init como proceso 1: reenvía SIGTERM/SIGINT y recoge procesos huérfanos.
  init: true

services:
  ingest:
    <<: *app
    # En un perfil aparte: `docker compose up` no lo arranca;
    # `docker compose run --rm ingest` sí.
    profiles: ["manual"]
    restart: "no"
    volumes: [*data]

  scheduler:
    <<: *app
    entrypoint: ["python", "/app/container/scheduler.py"]
    restart: unless-stopped
    volumes: [*data, *backups]
    environment:
      TZ: Europe/Madrid
      CAPTURE_INTERVAL_HOURS: ${CAPTURE_INTERVAL_HOURS:-}
      # Solo la máquina con COLLECTION_ENABLED=true captura y copia (hoy, el VPS).
      COLLECTION_ENABLED: ${COLLECTION_ENABLED:-}
      # Solo para pruebas (servidor local); vacío = API del Ministerio.
      INGEST_API_URL: ${INGEST_API_URL:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    <<: *app
    # Copia a mano, también con el programador parado. Como `ingest`, en el
    # perfil `manual`: `docker compose up` no la lanza.
    profiles: ["manual"]
    restart: "no"
    entrypoint: ["python", "/app/container/backup.py", "--manual"]
    volumes: [*data, *backups]
    environment:
      TZ: Europe/Madrid
      COLLECTION_ENABLED: ${COLLECTION_ENABLED:-}

  api:
    <<: *app
    # API de solo lectura (prices-api). Independiente de COLLECTION_ENABLED.
    entrypoint: ["python", "/app/container/api.py"]
    restart: unless-stopped
    # ./data en solo lectura y sin ./backups: la API nunca escribe.
    volumes:
      - <<: *data
        read_only: true
    # Solo en 127.0.0.1 del host: Docker se salta ufw, así que nunca se publica
    # en todas las interfaces. Desde el Mac se usa con un túnel SSH (README).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TZ: Europe/Madrid
      # Para el umbral de «desactualizada» de la salud (2 × intervalo + 1 h).
      CAPTURE_INTERVAL_HOURS: ${CAPTURE_INTERVAL_HOURS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
